<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121826">
  <meta name="description" content="View contacts and conversations in the Chatly messaging dashboard.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="application-name" content="Chatly">
  <title>Chatly — Chat Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/pulse/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
  <main id="appShell" class="vh-100 d-flex flex-column overflow-hidden">
    <nav class="navbar navbar-dark bg-dark border-bottom border-primary border-opacity-50 flex-shrink-0">
      <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand fw-semibold" href="dashboard.html">
          <i class="bi bi-chat-square-heart-fill text-primary me-2"></i>Chatly
        </a>
        <div class="d-flex align-items-center gap-2 gap-md-3">
          <span id="profileAvatar" class="rounded-circle bg-primary text-white fw-semibold p-2">U</span>
          <span id="profileName" class="d-none d-sm-inline small fw-medium"></span>
          <button id="logoutButton" class="btn btn-outline-light btn-sm" type="button">
            <i class="bi bi-box-arrow-right me-1"></i><span class="d-none d-sm-inline">Logout</span>
          </button>
        </div>
      </div>
    </nav>

    <section class="container-fluid flex-grow-1 overflow-hidden py-3">
      <div class="row h-100 g-3">
        <aside id="usersPanel" class="col-12 col-lg-4 h-100 d-lg-block" aria-label="All users">
          <div class="card bg-body-secondary border-secondary h-100 overflow-hidden">
            <div class="card-body d-flex flex-column p-3 overflow-hidden">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                  <h1 class="h5 mb-1">All Users</h1>
                  <p class="text-secondary small mb-0"><span id="userCount">0</span> users</p>
                </div>
                <span class="badge rounded-pill text-bg-primary"><i class="bi bi-people-fill me-1"></i>People</span>
              </div>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input id="userSearch" class="form-control" type="search" placeholder="Search users..." aria-label="Search users">
              </div>
              <div id="userList" class="list-group flex-grow-1 overflow-auto mt-3"></div>
            </div>
          </div>
        </aside>

        <section id="chatPanel" class="col-12 col-lg-8 h-100 d-none d-lg-block" aria-label="Chat window">
          <div class="card bg-body-secondary border-secondary h-100">
            <header class="card-header bg-body-secondary border-secondary d-flex align-items-center gap-3 py-3">
              <button id="backToUsers" class="btn btn-outline-secondary btn-sm d-lg-none" type="button" aria-label="Back to users">
                <i class="bi bi-arrow-left"></i>
              </button>
              <span id="activeAvatar" class="rounded-circle bg-primary text-white fw-semibold p-2">?</span>
              <div class="flex-grow-1">
                <h2 id="activeName" class="h6 mb-1">Select a conversation</h2>
                <p id="activeStatus" class="text-secondary small mb-0">Choose a user to start chatting</p>
              </div>
            </header>

            <div id="messageArea" class="card-body bg-body-tertiary overflow-y-auto d-flex flex-column">
              <div id="emptyChat" class="text-center text-secondary m-auto">
                <i class="bi bi-chat-dots display-5"></i>
                <p class="mt-2 mb-0">Select a user to view messages.</p>
              </div>
              <div id="messageList" class="mt-auto"></div>
            </div>

            <footer class="card-footer bg-body-secondary border-secondary p-3">
              <form id="messageForm" class="d-flex gap-2">
                <input id="messageInput" class="form-control" type="text" placeholder="Type a message..." maxlength="1000" autocomplete="off" aria-label="Type a message" disabled>
                <button id="sendButton" class="btn btn-primary px-3" type="submit" aria-label="Send message" disabled>
                  <i class="bi bi-send-fill"></i><span class="d-none d-sm-inline ms-1">Send</span>
                </button>
              </form>
              <p class="text-secondary small text-center mt-2 mb-0"><i class="bi bi-chat-heart me-1"></i>Good conversations make the day better</p>
            </footer>
          </div>
        </section>
      </div>
    </section>
  </main>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
